# Shared by the long-running user service and its bootstrap-only job
x-user-service-env: &user-service-env
  SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/${USER_DB_NAME}
  SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME}
  SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
  JWT_PRIVATE_KEY_LOCATION: file:/app/keys/private.pem
  JWT_PUBLIC_KEY_LOCATION: file:/app/keys/public.pem
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  USER_CORS_ALLOWED_ORIGINS: ${USER_CORS_ALLOWED_ORIGINS:-http://localhost:5173}

services:

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093  # Single broker

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  # Debezium on Kafka Connect: streams each service's outbox table to Kafka (one topic per event type)
  kafka-connect:
    image: quay.io/debezium/connect:3.6.3.Final
    container_name: kafka-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      GROUP_ID: debezium-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Connector configs read DB credentials as ${env:...} instead of hard-coding them
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      USER_DB_NAME: ${USER_DB_NAME}
      USER_DB_USERNAME: ${USER_DB_USERNAME}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD}
      ORDER_DB_NAME: ${ORDER_DB_NAME}
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD}
      SUPPLIER_DB_NAME: ${SUPPLIER_DB_NAME}
      SUPPLIER_DB_USERNAME: ${SUPPLIER_DB_USERNAME}
      SUPPLIER_DB_PASSWORD: ${SUPPLIER_DB_PASSWORD}
    depends_on:
      - kafka
      - user-db
      - order-db
      - supplier-db
    networks:
      - default
      - user-net
    restart: unless-stopped

  # One-off job: registers the connectors in ./debezium/connectors (idempotent), then exits
  connect-init:
    image: curlimages/curl:8.11.1
    entrypoint: ["sh", "/register-connectors.sh"]
    environment:
      CONNECT_URL: http://kafka-connect:8083
    volumes:
      - ./debezium/connectors:/connectors:ro
      - ./debezium/register-connectors.sh:/register-connectors.sh:ro
    depends_on:
      - kafka-connect
    restart: "no"

  order-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium reads the outbox from the WAL
    environment:
      POSTGRES_DB: ${ORDER_DB_NAME}
      POSTGRES_USER: ${ORDER_DB_USERNAME}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "${ORDER_DB_PORT:-5435}:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${ORDER_DB_USERNAME} -d ${ORDER_DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  order-service:
    build: ./order-service
    image: campuscouriers/order-service
    environment:
      DB_HOST: order-db
      DB_PORT: 5432
      DB_NAME: ${ORDER_DB_NAME}
      DB_USERNAME: ${ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      USER_SERVICE_URL: ${USER_SERVICE_DOCKER_URL:-http://user-service:8080}
      SUPPLIER_SERVICE_URL: ${SUPPLIER_SERVICE_DOCKER_URL:-http://supplier-service:8080}
      JWT_ISSUER: ${JWT_ISSUER:-campuscouriers-user-service}
    ports:
      - "${ORDER_SERVICE_PORT:-8002}:8000"
    depends_on:
      order-db:
        condition: service_healthy
    restart: unless-stopped

  supplier-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium reads the outbox from the WAL
    environment:
      POSTGRES_DB: ${SUPPLIER_DB_NAME}
      POSTGRES_USER: ${SUPPLIER_DB_USERNAME}
      POSTGRES_PASSWORD: ${SUPPLIER_DB_PASSWORD}
    ports:
      - "${SUPPLIER_DB_PORT:-5433}:5432"
    volumes:
      - supplier-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${SUPPLIER_DB_USERNAME} -d ${SUPPLIER_DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  supplier-service:
    build: ./supplier-service
    image: campuscouriers/supplier-service
    environment:
      DB_HOST: supplier-db
      DB_PORT: 5432
      DB_NAME: ${SUPPLIER_DB_NAME}
      DB_USERNAME: ${SUPPLIER_DB_USERNAME}
      DB_PASSWORD: ${SUPPLIER_DB_PASSWORD}
      SUPPLIER_CORS_ALLOWED_ORIGINS: ${SUPPLIER_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      USER_SERVICE_URL: ${USER_SERVICE_DOCKER_URL:-http://user-service:8080}
    ports:
      - "8080:8080"
    depends_on:
      supplier-db:
        condition: service_healthy
    restart: unless-stopped

  user-db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical"]  # Debezium reads the outbox from the WAL
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_PORT:-5434}:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${USER_DB_USERNAME} -d ${USER_DB_NAME}
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - default
      - user-net
    restart: unless-stopped

  user-service:
    build: ./user-service
    image: campuscouriers/user-service
    environment:
      <<: *user-service-env
    ports:
      - "${USER_SERVICE_PORT:-8081}:8080"
    volumes:
      - ./user-service/keys:/app/keys:ro
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - default
      - user-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: campuscouriers/frontend
    environment:
      VITE_SUPPLIER_API_URL: ${VITE_SUPPLIER_API_URL:-http://localhost:8080}
      VITE_USER_API_URL: ${VITE_USER_API_URL:-http://localhost:8081}
      VITE_MOCK_AUTH: ${VITE_MOCK_AUTH:-false}
    ports:
      - "5173:5173"
    depends_on:
      - supplier-service
      - user-service
    restart: unless-stopped

  # One-off job: creates the first administrator if none exists, then exits (non-zero on failure).
  # Only started explicitly: docker compose --profile jobs run --rm user-bootstrap
  user-bootstrap:
    build: ./user-service
    image: campuscouriers/user-service
    profiles:
      - jobs
    environment:
      <<: *user-service-env
      SPRING_PROFILES_ACTIVE: bootstrap-admin
    volumes:
      - ./user-service/keys:/app/keys:ro
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - user-net
    restart: "no"

networks:
  user-net:

volumes:
  order-db-data:
  supplier-db-data:
  user-db-data:
