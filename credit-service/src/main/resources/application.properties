spring.application.name=credit

credit.wallet.default-credits= 30

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuscouriers_credit}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
credit.cors.allowed-origins=${CREDIT_CORS_ALLOWED_ORIGINS:http://localhost:5173}



