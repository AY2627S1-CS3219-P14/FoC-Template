spring.application.name=credit

credit.wallet.default-credits= 30

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuscouriers_credit}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER:campuscouriers-user-service}
credit.cors.allowed-origins=${CREDIT_CORS_ALLOWED_ORIGINS:http://localhost:5173}
credit.order-service-key=${ORDER_CREDIT_SERVICE_KEY:}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.campuscouriers.credit.event.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

spring.kafka.consumer.group-id=credit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.campuscouriers.credit.event.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.campuscouriers.credit.event
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer


