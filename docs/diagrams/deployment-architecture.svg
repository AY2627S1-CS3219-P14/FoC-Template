  <title id="title">CampusCouriers deployment architecture</title>
  <desc id="desc">Users access a React frontend served through the public edge. The backend runs as Kubernetes deployments behind an ingress, with RDS databases, Kafka, Debezium, and AWS secrets.</desc>
