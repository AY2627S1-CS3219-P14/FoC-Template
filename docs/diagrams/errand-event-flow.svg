<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">CampusCouriers errand and event flow</title>
  <desc id="desc">A requester creates an errand, the order service reserves credits, a courier accepts and delivers it, and completion or expiry causes credit updates and notifications through Kafka.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#334155"/></marker><style>.bg{fill:#f8fafc}.title{font:700 32px Arial;fill:#0f172a}.h{font:700 20px Arial;fill:#0f172a}.t{font:16px Arial;fill:#475569}.step{fill:#dbeafe;stroke:#334155;stroke-width:2;rx:14}.decision{fill:#fef3c7;stroke:#334155;stroke-width:2}.sys{fill:#ecfeff;stroke:#334155;stroke-width:2;rx:14}.event{fill:#ede9fe;stroke:#7c3aed;stroke-width:2;rx:14}.line{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c3aed;stroke-width:2.5;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1600" height="900"/><text class="title" x="70" y="65">CampusCouriers — Core Errand and Event Flow</text><text class="t" x="70" y="98">Example storyline for the live demo: request → accept → deliver → complete</text>
  <rect class="step" x="80" y="180" width="250" height="100"/><text class="h" x="205" y="220" text-anchor="middle">1. Create errand</text><text class="t" x="205" y="250" text-anchor="middle">Requester submits item, supplier,</text><text class="t" x="205" y="272" text-anchor="middle">destination, credits, deadline</text>
  <rect class="sys" x="440" y="180" width="250" height="100"/><text class="h" x="565" y="220" text-anchor="middle">2. Reserve credits</text><text class="t" x="565" y="250" text-anchor="middle">Order Service calls</text><text class="t" x="565" y="272" text-anchor="middle">Credit Service</text>
  <rect class="event" x="800" y="180" width="300" height="100"/><text class="h" x="950" y="220" text-anchor="middle">3. Publish event</text><text class="t" x="950" y="250" text-anchor="middle">Outbox → Debezium → Kafka</text><text class="t" x="950" y="272" text-anchor="middle">errand.created</text>
  <rect class="sys" x="1210" y="180" width="300" height="100"/><text class="h" x="1360" y="220" text-anchor="middle">4. Notify participants</text><text class="t" x="1360" y="250" text-anchor="middle">Notification Service stores</text><text class="t" x="1360" y="272" text-anchor="middle">and streams notification</text>
  <path class="line" d="M330 230 H440"/><path class="line" d="M690 230 H800"/><path class="line" d="M1100 230 H1210"/>

  <rect class="step" x="80" y="430" width="250" height="100"/><text class="h" x="205" y="470" text-anchor="middle">5. Courier accepts</text><text class="t" x="205" y="500" text-anchor="middle">Order becomes ACCEPTED</text><text class="t" x="205" y="522" text-anchor="middle">and courier is assigned</text>
  <rect class="event" x="440" y="430" width="250" height="100"/><text class="h" x="565" y="470" text-anchor="middle">6. Chat and updates</text><text class="t" x="565" y="500" text-anchor="middle">WebSocket conversation</text><text class="t" x="565" y="522" text-anchor="middle">and live notifications</text>
  <rect class="step" x="800" y="430" width="250" height="100"/><text class="h" x="925" y="470" text-anchor="middle">7. Deliver item</text><text class="t" x="925" y="500" text-anchor="middle">Courier marks errand</text><text class="t" x="925" y="522" text-anchor="middle">DELIVERED</text>
  <rect class="sys" x="1160" y="430" width="350" height="100"/><text class="h" x="1335" y="470" text-anchor="middle">8. Complete and settle</text><text class="t" x="1335" y="500" text-anchor="middle">Requester confirms; Credit Service</text><text class="t" x="1335" y="522" text-anchor="middle">releases/transfers reservation</text>
  <path class="line" d="M205 280 V430"/><path class="line" d="M330 480 H440"/><path class="line" d="M690 480 H800"/><path class="line" d="M1050 480 H1160"/>

  <rect class="decision" x="250" y="690" width="300" height="90"/><text class="h" x="400" y="728" text-anchor="middle">Deadline reached?</text><text class="t" x="400" y="756" text-anchor="middle">OPEN → EXPIRED; ACCEPTED → FAILED</text>
  <rect class="event" x="700" y="670" width="330" height="130"/><text class="h" x="865" y="710" text-anchor="middle">Expiry event</text><text class="t" x="865" y="742" text-anchor="middle">Kafka: errand.expired</text><text class="t" x="865" y="766" text-anchor="middle">Credit reservation safely released</text>
  <rect class="sys" x="1180" y="690" width="300" height="90"/><text class="h" x="1330" y="728" text-anchor="middle">Notify requester/courier</text><text class="t" x="1330" y="756" text-anchor="middle">Failure or expiry notification</text>
  <path class="dash" d="M205 530 V650 H400 V690"/><path class="line" d="M550 735 H700"/><path class="dash" d="M1030 735 H1180"/>
  <text class="t" x="85" y="840">Solid arrows: synchronous API calls or workflow transitions</text><text class="t" x="85" y="865">Dashed purple arrows: asynchronous event propagation</text>
</svg>
