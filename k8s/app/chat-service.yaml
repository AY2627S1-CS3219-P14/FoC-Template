# chat-service (FastAPI): one conversation per errand between requester and courier. REST for
# history, a WebSocket for live messages (/conversations/{id}/ws, opened with a one-time ticket from
# POST /conversations/{id}/ws-ticket), and a Kafka consumer that opens/closes conversations as
# errands progress. Same layout as user-service.yaml, which has the full explanations.
#
# EXACTLY ONE POD, on purpose (no HorizontalPodAutoscaler):
#   Open WebSockets live in one pod's memory, and a new message is only broadcast to sockets on the
#   pod that received it. With 2+ pods, two people in the same conversation can land on different pods
#   and miss each other's messages until they reload. Scaling out needs a shared broadcast first
#   (e.g. Redis pub/sub or PostgreSQL LISTEN/NOTIFY). Tickets are in the database, so they're fine.
#
# Database migrations: the image runs `alembic upgrade head` before starting. Fine with one pod (unlike
# order-service, which runs them as a Job because it has several).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chat-service
  namespace: campuscouriers-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: campuscouriers-app
  labels:
    app.kubernetes.io/name: chat-service
spec:
  replicas: 1 # see the top of this file
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: chat-service
  strategy:
    rollingUpdate:
      maxSurge: 1 # the new pod starts before the old one stops; the frontend reconnects its socket
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chat-service
    spec:
      serviceAccountName: chat-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image runs as root by default; run it as an unprivileged uid instead
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chat-service
          image: campuscouriers/chat-service
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: chat-service-config # generated from k8s/app/config/chat-service.env
            - secretRef:
                name: chat-db-credentials # DB_USERNAME, DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe: # migrations run first, so allow up to 2 minutes
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# Exposed on 8080 like the other services; forwards to the container's 8000
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: campuscouriers-app
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chat-service
  ports:
    - name: http
      port: 8080
      targetPort: http
# No PodDisruptionBudget: with a single pod, "keep at least 1" would block node upgrades forever.
