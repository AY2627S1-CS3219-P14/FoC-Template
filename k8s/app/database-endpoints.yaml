# Stable in-cluster names for the RDS databases.
#
# An ExternalName Service is just a DNS alias: "user-db" resolves to the RDS endpoint. The services keep
# using DB_HOST=user-db (the same name as in compose.yaml), and only this file changes when the endpoint does.
# Later, Terraform can write the real endpoint here.
#
# All four point at one RDS instance holding four databases (one per service). To give a service its
# own instance, change only its externalName.
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: campuscouriers-app
spec:
  type: ExternalName
  externalName: campuscouriers.cd2g48wauxqx.ap-southeast-1.rds.amazonaws.com # terraform output rds_address
---
