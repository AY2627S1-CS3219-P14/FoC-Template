# Kubernetes Secrets built from AWS Secrets Manager by External Secrets Operator.
#
# Each ExternalSecret says "make Kubernetes Secret <target> from Secrets Manager secret <key>".
# The Secrets Manager value is JSON; `extract` turns each JSON field into one key of the Secret.
# ESO re-reads it every refreshInterval, so a changed value reaches the cluster within the hour.
# (Mounted files, like the JWT keys, update in place; environment variables need a pod restart:
#  kubectl rollout restart deployment/<name> -n campuscouriers-app)

# JWT signing keys, mounted as files by user-service and the user-bootstrap Job
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-service-jwt
  namespace: campuscouriers-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: user-service-jwt # the Kubernetes Secret user-service.yaml mounts
    creationPolicy: Owner # deleting this ExternalSecret deletes the Secret too
  dataFrom:
    - extract:
        key: campuscouriers/user-service-jwt # JSON: {"private.pem": "...", "public.pem": "..."}
---
# First administrator, read by the user-bootstrap Job
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-bootstrap-admin
  namespace: campuscouriers-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: user-bootstrap-admin
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: campuscouriers/user-bootstrap-admin # JSON: {"BOOTSTRAP_ADMIN_NAME": ..., "_EMAIL": ..., "_PASSWORD": ...}
---
# Database credentials, one per service: DB_USERNAME + DB_PASSWORD, read via envFrom in each
# Deployment. Generated by Terraform (terraform/infra/rds.tf); the users themselves are created by
# the db-init Job (k8s/ops).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: user-db-credentials
  namespace: campuscouriers-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: user-db-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: campuscouriers/db/user-service # JSON: {"DB_USERNAME": ..., "DB_PASSWORD": ...}
---
