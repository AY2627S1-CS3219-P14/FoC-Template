# Shared key order-service sends to credit-service (X-Order-Service-Key) to prove a credit
# reservation comes from order-service. One Secret, mounted by both Deployments. Generated by
# Terraform (terraform/infra/external-secrets.tf). After rotating it, restart BOTH services.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: order-credit-service-key
  namespace: campuscouriers-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: order-credit-service-key
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: campuscouriers/order-credit-service-key # JSON: {"ORDER_CREDIT_SERVICE_KEY": ...}
---
# OpenAI API key for ai-errand-assistant-service. Terraform creates the empty Secrets Manager secret
# (terraform/infra/external-secrets.tf); a person stores the key in it, so the key is never in git or
# in Terraform state. Until then this ExternalSecret reports an error and the service runs without
# AI drafts. Steps: k8s/README.md, "API keys".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-assistant-openai
  namespace: campuscouriers-app
spec:
  refreshInterval: 15m # how soon a newly stored or rotated key reaches the cluster
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: ai-assistant-openai
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: campuscouriers/openai-api-key # JSON: {"OPENAI_API_KEY": "sk-..."}
---
# rag-service and its rag-index Job read one DATABASE_URL instead of separate fields, so the login
# from Secrets Manager is put into a connection string here. The generated passwords are letters and
# digits only (terraform/infra/rds.tf), so they need no escaping in a URL. RDS requires TLS.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-db-credentials
  namespace: campuscouriers-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: rag-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DATABASE_URL: "postgresql://{{ .DB_USERNAME }}:{{ .DB_PASSWORD }}@rag-db:5432/campuscouriers_rag?sslmode=require"
  dataFrom:
    - extract:
        key: campuscouriers/db/rag-service # JSON: {"DB_USERNAME": ..., "DB_PASSWORD": ...}
---
# Claude (Anthropic) API key for rag-service. Terraform creates the empty Secrets Manager secret
# (terraform/infra/external-secrets.tf); a person stores the key in it, so it's never in git or in
# Terraform state. Until then this ExternalSecret reports an error and the Assistant answers 503.
# Steps: k8s/README.md, "API keys".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rag-anthropic
  namespace: campuscouriers-app
spec:
  refreshInterval: 15m # how soon a newly stored or rotated key reaches the cluster
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: rag-anthropic
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: campuscouriers/anthropic-api-key # JSON: {"ANTHROPIC_API_KEY": "sk-ant-..."}
