# order-service (FastAPI): creating and progressing errands.
# Same layout as user-service.yaml, which has the full explanations.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: campuscouriers-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: campuscouriers-app
  labels:
    app.kubernetes.io/name: order-service
spec:
  # Pod count is owned by the HorizontalPodAutoscaler below
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      serviceAccountName: order-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # the image runs as root by default; run it as an unprivileged uid instead
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      containers:
        - name: order-service
          image: campuscouriers/order-service
          # The image's default command runs `alembic upgrade head` before starting. With several
          # replicas that would run the same migration in parallel, so here we only start the server;
          # migrations run once in the order-migrate Job (k8s/jobs/order-migrate.yaml).
          command: ["uvicorn", "main.app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: order-service-config # generated from k8s/app/config/order-service.env
            - secretRef:
                name: order-db-credentials # DB_USERNAME, DB_PASSWORD
            - secretRef:
                name: order-credit-service-key # ORDER_CREDIT_SERVICE_KEY, sent to credit-service
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# Exposed on 8080 like the other services; forwards to the container's 8000
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: campuscouriers-app
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: order-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: campuscouriers-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: order-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: order-service
  namespace: campuscouriers-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
