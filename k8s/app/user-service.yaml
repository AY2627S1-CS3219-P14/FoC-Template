# user-service: accounts, login, and issuing JWTs.
# This file is the fully commented reference; the other services follow the same layout.

# --- Identity --------------------------------------------------------------------------------------
# Each service gets its own ServiceAccount so that, if it ever needs AWS access, it can be given its
# own IAM role without the other services sharing it (IRSA, see terraform/infra/irsa.tf):
# add the role to irsa_service_accounts there, then annotate this ServiceAccount:
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  namespace: campuscouriers-app
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/campuscouriers-user-service
---
# --- Non-secret settings ---------------------------------------------------------------------------
# Not in this file: they're in k8s/app/config/user-service.env, which k8s/kustomization.yaml turns into
# a ConfigMap whose name includes a hash of its contents. Any settings change = new name = the
# Deployment below changes = Kubernetes rolls the pods. Passwords and keys come from Secrets.
# --- The pods ----------------------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: campuscouriers-app
  labels:
    app.kubernetes.io/name: user-service
spec:
  # No "replicas" field on purpose: the HorizontalPodAutoscaler below owns the pod count.
  # Setting it here too would reset the count on every `kubectl apply`.
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
  strategy:
    rollingUpdate:
      maxSurge: 1 # start one new pod at a time...
      maxUnavailable: 0 # ...and never drop below the current count during a deploy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-service
    spec:
      serviceAccountName: user-service
      automountServiceAccountToken: false # the app never calls the Kubernetes API
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # matches the uid created in user-service/Dockerfile
        runAsGroup: 10001
        fsGroup: 10001 # makes the mounted JWT key files readable by that group
        seccompProfile:
          type: RuntimeDefault
      # Spread pods across Availability Zones first, then across nodes, so losing one AZ or node
      # never takes every replica down. "ScheduleAnyway" = prefer, but still schedule if impossible.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: user-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: user-service
      containers:
        - name: user-service
          image: campuscouriers/user-service # rewritten to the ECR image by k8s/kustomization.yaml
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: user-service-config # generated from k8s/app/config/user-service.env
            - secretRef:
                name: user-db-credentials # DB_USERNAME, DB_PASSWORD
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
          # Requests: what the scheduler reserves, and what the HPA's "70% CPU" is measured against.
          # Limits: the hard ceiling. Memory over the limit = pod killed (OOMKilled).
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          # Probes (endpoints come from Spring Boot Actuator):
          #   startup   - gives the JVM up to 3 minutes to boot before the other probes start
          #   liveness  - if this fails, Kubernetes restarts the container
          #   readiness - if this fails, the pod is taken out of the Service/ALB but not restarted
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            # On shutdown, keep serving for 15s while the ALB stops sending traffic to this pod;
            # otherwise in-flight requests during a deploy or scale-down get 502s.
            preStop:
              sleep:
                seconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: jwt-keys
          secret:
            secretName: user-service-jwt # private.pem, public.pem
            defaultMode: 0440
---
# --- Stable address --------------------------------------------------------------------------------
# Other pods reach this service at http://user-service:8080, and the Ingress points the ALB here.
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: campuscouriers-app
  annotations:
    # Health check the ALB uses for this service's target group
    alb.ingress.kubernetes.io/healthcheck-path: /actuator/health/readiness
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# --- Scaling ---------------------------------------------------------------------------------------
# Keeps 2-5 pods, adding pods when average CPU passes 70% of the request (250m).
# Needs metrics-server installed in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: user-service
  namespace: campuscouriers-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: user-service
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300 # wait 5 minutes of low load before removing pods
---
# --- Disruption budget -----------------------------------------------------------------------------
# Voluntary disruptions (node upgrades, node draining, Karpenter consolidation) may never take
# the service below 1 running pod. Doesn't apply to crashes, only to planned evictions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: user-service
  namespace: campuscouriers-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-service
