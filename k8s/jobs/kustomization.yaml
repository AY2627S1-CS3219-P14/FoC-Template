# One-off Jobs. Apply:  kubectl apply -k k8s/jobs
# Needs the namespaces, ConfigMaps and Secrets from k8s/ to exist first.
# A Job can't be changed once created; finished Jobs delete themselves after an hour
# (ttlSecondsAfterFinished), or delete one by hand to re-run it sooner.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - order-migrate.yaml
  - user-bootstrap.yaml
  - supplier-seed.yaml
  - register-connectors.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: campuscouriers
    includeSelectors: false

# Keep in sync with k8s/kustomization.yaml
images:
  - name: campuscouriers/user-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/user-service
    newTag: 13b609abdf18
  - name: campuscouriers/supplier-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/supplier-service
    newTag: ed1dc9e5677e
  - name: campuscouriers/order-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/order-service
    newTag: 13b609abdf18
