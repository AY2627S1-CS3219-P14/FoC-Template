# Registers the Debezium connectors with Kafka Connect, then exits. Same script and connector files
# as compose.yaml's connect-init. Both come from the "debezium-connectors" ConfigMap, built straight
# from the debezium/ folder (see k8s/README.md), so there is only one copy of each.
apiVersion: batch/v1
kind: Job
metadata:
  name: register-connectors
  namespace: campuscouriers-messaging
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: register-connectors # allowed through k8s/messaging/network-policies.yaml
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100 # curl_user in the curlimages/curl image
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: register
          image: curlimages/curl:8.11.1
          # The ConfigMap holds the script and the *.json connector files; the script only reads *.json
          command: ["sh", "/connectors/register-connectors.sh"]
          env:
            - name: CONNECT_URL
              value: http://kafka-connect:8083
          volumeMounts:
            - name: debezium
              mountPath: /connectors
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: debezium
          configMap:
            name: debezium-connectors
