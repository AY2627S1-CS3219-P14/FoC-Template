# Imports the supplier seed CSV bundled in the image, then exits. Safe to re-run: existing
# suppliers are skipped.
apiVersion: batch/v1
kind: Job
metadata:
  name: supplier-seed
  namespace: campuscouriers-app
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supplier-seed
    spec:
      restartPolicy: Never
      serviceAccountName: supplier-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: campuscouriers/supplier-service
          env:
            - name: SUPPLIER_SEED_ENABLED # turns on SupplierSeedRunner
              value: "true"
            - name: SPRING_MAIN_WEB_APPLICATION_TYPE # no web server, so the app exits after the import
              value: none
            # Same values as k8s/app/config/supplier-service.env (Jobs can't reference the generated,
            # hash-named ConfigMap from their separate kustomization)
            - { name: DB_HOST, value: supplier-db }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: campuscouriers_supplier }
            - { name: USER_SERVICE_URL, value: "http://user-service:8080" }
          envFrom:
            - secretRef:
                name: supplier-db-credentials
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
