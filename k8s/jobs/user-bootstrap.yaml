# Creates the first administrator if none exists, then exits.
# The Kubernetes version of `docker compose --profile jobs run --rm user-bootstrap`.
apiVersion: batch/v1
kind: Job
metadata:
  name: user-bootstrap
  namespace: campuscouriers-app
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: user-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: campuscouriers/user-service
          env:
            # application-bootstrap-admin.properties: no web server, create the admin, exit
            - name: SPRING_PROFILES_ACTIVE
              value: bootstrap-admin
            # Same values as k8s/app/config/user-service.env (Jobs can't reference the generated,
            # hash-named ConfigMap from their separate kustomization)
            - { name: DB_HOST, value: user-db }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: campuscouriers_user }
            - { name: JWT_PRIVATE_KEY_LOCATION, value: "file:/app/keys/private.pem" }
            - { name: JWT_PUBLIC_KEY_LOCATION, value: "file:/app/keys/public.pem" }
          envFrom:
            - secretRef:
                name: user-db-credentials
            - secretRef:
                name: user-bootstrap-admin # BOOTSTRAP_ADMIN_NAME, _EMAIL, _PASSWORD
          volumeMounts:
            - name: jwt-keys
              mountPath: /app/keys
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: jwt-keys
          secret:
            secretName: user-service-jwt
            defaultMode: 0440
