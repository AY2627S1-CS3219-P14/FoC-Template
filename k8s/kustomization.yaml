# Everything that runs continuously. Preview:  kubectl kustomize k8s
#                                     Apply:    kubectl apply -k k8s
# One-off Jobs live separately in k8s/jobs/ so they run only when you choose.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - domain.yaml # build-time settings only (never applied); see replacements below
  - namespaces.yaml
  # platform (needs the External Secrets Operator from terraform/infra installed first)
  - platform/cluster-secret-store.yaml
  # messaging
  - messaging/storageclass.yaml
  - messaging/database-endpoints.yaml
  - messaging/external-secrets.yaml
  - messaging/kafka.yaml
  - messaging/kafka-connect.yaml
  - messaging/network-policies.yaml
  # app
  - app/database-endpoints.yaml
  - app/external-secrets.yaml
  - app/user-service.yaml
  - app/supplier-service.yaml
  - app/credit-service.yaml
  - app/order-service.yaml
  - app/notification-service.yaml
  - app/chat-service.yaml
  - app/ai-errand-assistant-service.yaml
  - app/rag-service.yaml
  - app/ingress.yaml
  - app/network-policies.yaml

# Each service's non-secret settings, from app/config/<service>.env. The generated name ends in a
# hash of the contents (user-service-config-7c2f88fd49) and every reference to it is rewritten, so
# changing a setting, or domain.yaml, changes the Deployment and Kubernetes rolls the pods by itself.
configMapGenerator:
  - name: user-service-config
    namespace: campuscouriers-app
    envs: [app/config/user-service.env]
  - name: supplier-service-config
    namespace: campuscouriers-app
    envs: [app/config/supplier-service.env]
  - name: credit-service-config
    namespace: campuscouriers-app
    envs: [app/config/credit-service.env]
  - name: order-service-config
    namespace: campuscouriers-app
    envs: [app/config/order-service.env]
  - name: notification-service-config
    namespace: campuscouriers-app
    envs: [app/config/notification-service.env]
  - name: chat-service-config
    namespace: campuscouriers-app
    envs: [app/config/chat-service.env]
  - name: ai-errand-assistant-service-config
    namespace: campuscouriers-app
    envs: [app/config/ai-errand-assistant-service.env]
  - name: rag-service-config
    namespace: campuscouriers-app
    envs: [app/config/rag-service.env]

# Added to every resource's metadata (not to selectors, which can't change after creation)
labels:
  - pairs:
      app.kubernetes.io/part-of: campuscouriers
    includeSelectors: false

# Copies the domain from domain.yaml into every field that needs it
replacements:
  - source:
      kind: ConfigMap
      name: domain-settings
      fieldPath: data.apiHost
    targets:
      - select:
          kind: Ingress
          name: api
        fieldPaths:
          - spec.rules.0.host
  - source:
      kind: ConfigMap
      name: domain-settings
      fieldPath: data.appOrigin
    targets:
      - select: { kind: ConfigMap, name: user-service-config }
        fieldPaths: [data.USER_CORS_ALLOWED_ORIGINS]
      - select: { kind: ConfigMap, name: supplier-service-config }
        fieldPaths: [data.SUPPLIER_CORS_ALLOWED_ORIGINS]
      - select: { kind: ConfigMap, name: credit-service-config }
        fieldPaths: [data.CREDIT_CORS_ALLOWED_ORIGINS]
      - select: { kind: ConfigMap, name: order-service-config }
        fieldPaths: [data.ORDER_CORS_ALLOWED_ORIGINS]
      - select: { kind: ConfigMap, name: notification-service-config }
        fieldPaths: [data.NOTIFICATION_CORS_ALLOWED_ORIGINS]
      - select: { kind: ConfigMap, name: chat-service-config }
        fieldPaths: [data.CHAT_CORS_ALLOWED_ORIGINS]
      - select: { kind: ConfigMap, name: ai-errand-assistant-service-config }
        fieldPaths: [data.CORS_ALLOWED_ORIGINS]
      - select: { kind: ConfigMap, name: rag-service-config }
        fieldPaths: [data.RAG_CORS_ALLOWED_ORIGINS]

# The manifests say "image: campuscouriers/user-service" (the compose name). This rewrites it to
# the ECR repository and tag in one place. Keep in sync with k8s/jobs/kustomization.yaml.
# Set by scripts/build-and-push.ps1 (one git-SHA tag per build, so each deploy is traceable).
images:
  - name: campuscouriers/user-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/user-service
    newTag: ae4114ce1c8d
  - name: campuscouriers/supplier-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/supplier-service
    newTag: 88ca99a6c06a
  - name: campuscouriers/credit-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/credit-service
    newTag: 83d64c1b237c
  - name: campuscouriers/order-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/order-service
    newTag: 83d64c1b237c
  - name: campuscouriers/notification-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/notification-service
    newTag: 88ca99a6c06a
  - name: campuscouriers/chat-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/chat-service
    newTag: 88ca99a6c06a
  - name: campuscouriers/ai-errand-assistant-service
    newName: 596601390706.dkr.ecr.ap-southeast-1.amazonaws.com/campuscouriers/ai-errand-assistant-service
