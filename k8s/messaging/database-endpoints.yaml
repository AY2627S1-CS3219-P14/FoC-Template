# Debezium (Kafka Connect) reads the outbox of these databases. The connector configs in
# debezium/connectors/ use the hostnames user-db, order-db, supplier-db, credit-db and chat-db, as in
# compose.yaml. Service names only resolve within their own namespace, so the aliases are repeated
# here (see k8s/app/database-endpoints.yaml).
apiVersion: v1
kind: Service
metadata:
  name: user-db
  namespace: campuscouriers-messaging
spec:
  type: ExternalName
  externalName: campuscouriers.cd2g48wauxqx.ap-southeast-1.rds.amazonaws.com # terraform output rds_address
---
