# Credentials Kafka Connect (Debezium) uses to read the outbox of the user, order and supplier
# databases. The connector configs in debezium/connectors read them as ${env:USER_DB_PASSWORD} etc.
#
# Unlike the app secrets, this one combines several Secrets Manager secrets into one Kubernetes
# Secret, so it lists each field under `data` and arranges them with a `template`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: debezium-db-credentials
  namespace: campuscouriers-messaging
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: debezium-db-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        USER_DB_NAME: campuscouriers_user # fixed values can sit next to fetched ones
        USER_DB_USERNAME: "{{ .user_username }}"
        USER_DB_PASSWORD: "{{ .user_password }}"
        ORDER_DB_NAME: campuscouriers_order
        ORDER_DB_USERNAME: "{{ .order_username }}"
        ORDER_DB_PASSWORD: "{{ .order_password }}"
        SUPPLIER_DB_NAME: campuscouriers_supplier
        SUPPLIER_DB_USERNAME: "{{ .supplier_username }}"
        SUPPLIER_DB_PASSWORD: "{{ .supplier_password }}"
  data:
    - secretKey: user_username
      remoteRef: { key: campuscouriers/db/user-service, property: DB_USERNAME }
    - secretKey: user_password
      remoteRef: { key: campuscouriers/db/user-service, property: DB_PASSWORD }
    - secretKey: order_username
      remoteRef: { key: campuscouriers/db/order-service, property: DB_USERNAME }
    - secretKey: order_password
      remoteRef: { key: campuscouriers/db/order-service, property: DB_PASSWORD }
    - secretKey: supplier_username
      remoteRef: { key: campuscouriers/db/supplier-service, property: DB_USERNAME }
    - secretKey: supplier_password
      remoteRef: { key: campuscouriers/db/supplier-service, property: DB_PASSWORD }
