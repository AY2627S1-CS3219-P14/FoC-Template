# What db-init needs: the master login (to create things) and each service's credentials (to create
# those users with the right passwords).

# Master login, as the standard PG* variables psql reads. Combines two Secrets Manager secrets:
# the endpoint (written by Terraform) and the master username/password (created by RDS itself).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-admin
  namespace: campuscouriers-ops
spec:
  refreshInterval: 1h # RDS rotates the master password every 7 days; this picks up the new one
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PGHOST: "{{ .host }}"
        PGPORT: "{{ .port }}"
        PGUSER: "{{ .username }}"
        PGPASSWORD: "{{ .password }}"
  data:
    - secretKey: host
      remoteRef: { key: campuscouriers/db/connection, property: host }
    - secretKey: port
      remoteRef: { key: campuscouriers/db/connection, property: port }
    # TODO: the secret RDS created. Get it with: terraform -chdir=terraform/infra output -raw rds_master_secret_arn
    - secretKey: username
      remoteRef: { key: arn:aws:secretsmanager:ap-southeast-1:596601390706:secret:rds!db-096a2de5-5067-440a-b7d9-97c92e981325-WFwlNo, property: username }
    - secretKey: password
      remoteRef: { key: arn:aws:secretsmanager:ap-southeast-1:596601390706:secret:rds!db-096a2de5-5067-440a-b7d9-97c92e981325-WFwlNo, property: password }
---
# All service logins in one Secret: USER_DB_USERNAME, USER_DB_PASSWORD, SUPPLIER_..., ...
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-service-credentials
  namespace: campuscouriers-ops
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: db-service-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        USER_DB_USERNAME: "{{ .user_username }}"
        USER_DB_PASSWORD: "{{ .user_password }}"
        SUPPLIER_DB_USERNAME: "{{ .supplier_username }}"
        SUPPLIER_DB_PASSWORD: "{{ .supplier_password }}"
        CREDIT_DB_USERNAME: "{{ .credit_username }}"
        CREDIT_DB_PASSWORD: "{{ .credit_password }}"
        ORDER_DB_USERNAME: "{{ .order_username }}"
        ORDER_DB_PASSWORD: "{{ .order_password }}"
        CHAT_DB_USERNAME: "{{ .chat_username }}"
        CHAT_DB_PASSWORD: "{{ .chat_password }}"
        NOTIFICATION_DB_USERNAME: "{{ .notification_username }}"
        NOTIFICATION_DB_PASSWORD: "{{ .notification_password }}"
  data:
    - secretKey: user_username
      remoteRef: { key: campuscouriers/db/user-service, property: DB_USERNAME }
    - secretKey: user_password
      remoteRef: { key: campuscouriers/db/user-service, property: DB_PASSWORD }
    - secretKey: supplier_username
      remoteRef: { key: campuscouriers/db/supplier-service, property: DB_USERNAME }
    - secretKey: supplier_password
      remoteRef: { key: campuscouriers/db/supplier-service, property: DB_PASSWORD }
    - secretKey: credit_username
      remoteRef: { key: campuscouriers/db/credit-service, property: DB_USERNAME }
    - secretKey: credit_password
      remoteRef: { key: campuscouriers/db/credit-service, property: DB_PASSWORD }
    - secretKey: order_username
      remoteRef: { key: campuscouriers/db/order-service, property: DB_USERNAME }
    - secretKey: order_password
      remoteRef: { key: campuscouriers/db/order-service, property: DB_PASSWORD }
    - secretKey: chat_username
      remoteRef: { key: campuscouriers/db/chat-service, property: DB_USERNAME }
    - secretKey: chat_password
      remoteRef: { key: campuscouriers/db/chat-service, property: DB_PASSWORD }
    - secretKey: notification_username
      remoteRef: { key: campuscouriers/db/notification-service, property: DB_USERNAME }
    - secretKey: notification_password
      remoteRef: { key: campuscouriers/db/notification-service, property: DB_PASSWORD }
