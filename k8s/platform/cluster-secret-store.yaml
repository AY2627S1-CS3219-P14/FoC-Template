# Tells External Secrets Operator (installed by terraform/infra/external-secrets.tf) WHERE secrets
# come from. "Cluster" = usable from any namespace listed under conditions.
#
# No credentials here: the ESO controller authenticates with its own IAM role (IRSA), which may
# only read secrets named campuscouriers/*.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  conditions:
    - namespaces: ["campuscouriers-app", "campuscouriers-messaging", "campuscouriers-ops"]
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-1 # keep in sync with var.aws_region
