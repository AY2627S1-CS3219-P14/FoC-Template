spring.application.name=supplier

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuscouriers_supplier}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Public keys used to verify access tokens issued by the user service.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json
supplier.seed.enabled=${SUPPLIER_SEED_ENABLED:false}
supplier.seed.file=${SUPPLIER_SEED_FILE:classpath:seed/supplier-seed-data.csv}
