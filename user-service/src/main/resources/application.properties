spring.application.name=user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# JWT Key Configuration
app.jwt.private-key-location=classpath:keys/jwt-private.pem
app.jwt.public-key-location=classpath:keys/jwt-public.pem
app.jwt.issuer=campuscouriers-user-service
app.jwt.key-id=user-service-key-1
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=30d

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuscouriers_user}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}