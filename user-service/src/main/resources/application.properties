spring.application.name=user
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# JWT Key Configuration
app.jwt.private-key-location=${JWT_PRIVATE_KEY_LOCATION}
app.jwt.public-key-location=${JWT_PUBLIC_KEY_LOCATION}
app.jwt.issuer=campuscouriers-user-service
app.jwt.key-id=user-service-key-1
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

# CORS: frontend origins allowed to call this service with credentials (comma-separated)
app.cors.allowed-origins=${USER_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# First administrator, created on startup when no administrator exists (see AdminBootstrapService)
app.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campuscouriers_user}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Health checks for Kubernetes probes and the ALB: /actuator/health/liveness and /actuator/health/readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
